# SICK TIM571 — 270 deg FoV, 15 Hz, 25 m, 0.33 deg resolution
world:
  height: 35
  width: 35
  step_time: 0.067   # 15 Hz (1/15 ≈ 0.0667 s)
  sample_time: 0.067
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    state: [1, 1, 0]
    goal: [33, 33, 0]
    behavior: {name: 'dash'}
    sensors:
      - name: 'lidar2d'
        range_min: 0.05
        range_max: 25.0      # 25 m
        angle_range: 4.7124  # 270 deg
        number: 818          # 0.33 deg resolution
        noise: True
        std: 0.06            # 60 mm — lower accuracy than Hokuyo
        angle_std: 0.017     # ~1.0 deg
        offset: [0, 0, 0]
        plot:
          alpha: 0.3

obstacle:
  # Perimeter boundary wall
  - shape: {name: 'linestring', vertices: [[0.3, 0.3], [34.7, 0.3], [34.7, 34.7], [0.3, 34.7], [0.3, 0.3]]}
    state: [0, 0, 0]
  # Room dividers — horizontal wall at y=17 with gap x=13..19
  - shape: {name: 'linestring', vertices: [[0.3, 17], [13, 17]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[19, 17], [34.7, 17]]}
    state: [0, 0, 0]
  # Room dividers — vertical wall at x=17 with gap y=13..21
  - shape: {name: 'linestring', vertices: [[17, 0.3], [17, 13]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[17, 21], [17, 34.7]]}
    state: [0, 0, 0]
  # Inner partial walls for sub-rooms
  - shape: {name: 'linestring', vertices: [[8, 0.3], [8, 11]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[26, 23], [26, 34.7]]}
    state: [0, 0, 0]
  # Rectangles — industrial shelving and equipment
  - shape: {name: 'rectangle', length: 3.0, width: 1.5}
    state: [5, 5, 0.3]
  - shape: {name: 'rectangle', length: 4.5, width: 1.0}
    state: [5, 10, 0]
  - shape: {name: 'rectangle', length: 2.5, width: 1.8}
    state: [12, 5, 0.6]
  - shape: {name: 'rectangle', length: 3.5, width: 1.5}
    state: [23, 7, 0]
  - shape: {name: 'rectangle', length: 4.5, width: 1.2}
    state: [30, 5, 0.4]
  - shape: {name: 'rectangle', length: 3.0, width: 2.0}
    state: [5, 25, 0]
  - shape: {name: 'rectangle', length: 4.0, width: 1.5}
    state: [23, 29, 0.7]
  # Circles — structural pillars and storage silos
  - shape: {name: 'circle', radius: 1.2}
    state: [10, 10, 0]
  - shape: {name: 'circle', radius: 1.5}
    state: [24, 12, 0]
  - shape: {name: 'circle', radius: 1.0}
    state: [10, 28, 0]
  - shape: {name: 'circle', radius: 1.3}
    state: [29, 26, 0]
  - shape: {name: 'circle', radius: 1.0}
    state: [18, 18, 0]
