# YDLIDAR X4 — 360 deg, 10 Hz, 10 m, ~0.50 deg resolution
world:
  height: 15
  width: 15
  step_time: 0.100   # 10 Hz
  sample_time: 0.100
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    state: [1, 1, 0]
    goal: [13, 13, 0]
    behavior: {name: 'dash'}
    sensors:
      - name: 'lidar2d'
        range_min: 0.12      # 12 cm dead zone
        range_max: 10.0      # 10 m
        angle_range: 6.2832  # 360 deg
        number: 720          # 0.50 deg resolution
        noise: True
        std: 0.03            # 30 mm
        angle_std: 0.009
        offset: [0, 0, 0]
        plot:
          alpha: 0.3

obstacle:
  # Perimeter boundary wall
  - shape: {name: 'linestring', vertices: [[0.3, 0.3], [14.7, 0.3], [14.7, 14.7], [0.3, 14.7], [0.3, 0.3]]}
    state: [0, 0, 0]
  # Room dividers — horizontal wall at y=7 with gap x=5..8
  - shape: {name: 'linestring', vertices: [[0.3, 7], [5, 7]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[8, 7], [14.7, 7]]}
    state: [0, 0, 0]
  # Room dividers — vertical wall at x=7 with gap y=5..9
  - shape: {name: 'linestring', vertices: [[7, 0.3], [7, 5]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[7, 9], [7, 14.7]]}
    state: [0, 0, 0]
  # Rectangles — furniture and storage blocks
  - shape: {name: 'rectangle', length: 1.8, width: 0.8}
    state: [3, 3, 0.3]
  - shape: {name: 'rectangle', length: 2.0, width: 1.0}
    state: [11, 4, 0]
  - shape: {name: 'rectangle', length: 1.5, width: 0.8}
    state: [4, 10, 0.5]
  - shape: {name: 'rectangle', length: 2.2, width: 1.5}
    state: [11, 11, 0]
  # Circles — pillars and cylindrical obstacles
  - shape: {name: 'circle', radius: 0.6}
    state: [5, 4, 0]
  - shape: {name: 'circle', radius: 0.4}
    state: [10, 3, 0]
  - shape: {name: 'circle', radius: 0.5}
    state: [3, 12, 0]
  - shape: {name: 'circle', radius: 0.7}
    state: [12, 9, 0]
  - shape: {name: 'circle', radius: 0.4}
    state: [8, 12, 0]
