# Slamtec RPLiDAR A1M8 — 360 deg, 5.5 Hz, 12 m, 1.0 deg resolution
world:
  height: 20
  width: 20
  step_time: 0.182   # 5.5 Hz scan rate
  sample_time: 0.182
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    state: [1, 1, 0]
    goal: [18, 18, 0]
    behavior: {name: 'dash'}
    sensors:
      - name: 'lidar2d'
        range_min: 0.15      # 15 cm dead zone
        range_max: 12.0      # 12 m max range
        angle_range: 6.2832  # 360 deg full sweep
        number: 360          # 1.0 deg angular resolution
        noise: True
        std: 0.03            # 30 mm range noise (1-sigma)
        angle_std: 0.017     # ~1.0 deg angular noise (dead code, placeholder)
        offset: [0, 0, 0]
        plot:
          alpha: 0.3

obstacle:
  # Perimeter boundary wall
  - shape: {name: 'linestring', vertices: [[0.2, 0.2], [19.8, 0.2], [19.8, 19.8], [0.2, 19.8], [0.2, 0.2]]}
    state: [0, 0, 0]
  # Room dividers — horizontal wall at y=9 with gap x=11..13
  - shape: {name: 'linestring', vertices: [[0.2, 9], [11, 9]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[13, 9], [19.8, 9]]}
    state: [0, 0, 0]
  # Room dividers — vertical wall at x=9 with gap y=7..11
  - shape: {name: 'linestring', vertices: [[9, 0.2], [9, 7]]}
    state: [0, 0, 0]
  - shape: {name: 'linestring', vertices: [[9, 11], [9, 19.8]]}
    state: [0, 0, 0]
  # Rectangles — furniture / equipment blocks
  - shape: {name: 'rectangle', length: 2.5, width: 1.0}
    state: [4, 14, 0.4]
  - shape: {name: 'rectangle', length: 1.5, width: 2.0}
    state: [15, 5, 0.8]
  - shape: {name: 'rectangle', length: 3.0, width: 0.8}
    state: [14, 16, 0]
  - shape: {name: 'rectangle', length: 1.2, width: 1.8}
    state: [5, 5, 0.3]
  # Circles — pillars / cylindrical obstacles
  - shape: {name: 'circle', radius: 0.7}
    state: [4, 3, 0]
  - shape: {name: 'circle', radius: 0.5}
    state: [12, 4, 0]
  - shape: {name: 'circle', radius: 1.0}
    state: [17, 11, 0]
  - shape: {name: 'circle', radius: 0.6}
    state: [3, 17, 0]
  - shape: {name: 'circle', radius: 0.8}
    state: [13, 13, 0]
