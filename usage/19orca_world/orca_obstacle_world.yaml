# Eight ORCA robots cross a perlin map while four obstacles patrol its corridors.
# The occupied cells of the map are obstacles to the group, and the patrolling
# obstacles are moving agents it steers around: their position and velocity are
# fed to the simulator every step. ORCA is a local method, so every robot
# follows a few waypoints with a clear line of sight instead of one far goal.
world:
  height: 20
  width: 20
  step_time: 0.1
  sample_time: 0.1
  collision_mode: 'stop'
  obstacle_map:
    name: perlin
    resolution: 0.1
    complexity: 0.05
    fill: 0.16
    fractal: 1
    attenuation: 0.5
    seed: 5

robot:
  - number: 8
    color: 'cycle'
    kinematics: {name: 'omni'}
    shape: {name: 'circle', radius: 0.3}
    distribution: {name: 'manual'}
    state:
      - [17.7, 13.5, 0]
      - [13.2, 17.7, 0]
      - [7.2, 18.2, 0]
      - [1.7, 13.2, 0]
      - [2.0, 6.9, 0]
      - [6.7, 2.1, 0]
      - [13.6, 2.9, 0]
      - [17.4, 6.4, 0]
    goal:  # waypoints per robot
      - [[7.9, 15.5, 0], [4.0, 14.9, 0], [2.1, 14.8, 0], [1.7, 13.2, 0]]
      - [[10.2, 12.6, 0], [7.5, 11.4, 0], [2.0, 6.9, 0]]
      - [[3.6, 18.2, 0], [2.9, 16.2, 0], [5.4, 13.1, 0], [4.9, 4.4, 0], [6.7, 2.1, 0]]
      - [[1.7, 9.2, 0], [4.5, 8.7, 0], [7.5, 9.9, 0], [13.6, 2.9, 0]]
      - [[3.1, 8.3, 0], [7.6, 9.8, 0], [14.2, 5.6, 0], [16.4, 6.2, 0], [17.4, 6.4, 0]]
      - [[8.6, 1.7, 0], [15.5, 7.4, 0], [15.0, 11.8, 0], [17.7, 13.5, 0]]
      - [[15.2, 8.7, 0], [11.1, 13.2, 0], [13.2, 17.7, 0]]
      - [[15.5, 7.4, 0], [11.1, 13.4, 0], [12.9, 17.6, 0], [8.7, 18.9, 0], [7.2, 18.2, 0]]
    goal_threshold: 0.3
    vel_max: [1.0, 1.0]
    vel_min: [-1.0, -1.0]
    group_behavior:
      name: 'orca'
      neighborDist: 4.0
      maxNeighbors: 10
      timeHorizon: 2.0
      timeHorizonObst: 1.5
      safe_radius: 0.1
    plot:
      show_trajectory: true
      show_goal: true
      show_trail: true

obstacle:
  - number: 4
    kinematics: {name: 'omni'}
    shape: {name: 'circle', radius: 0.4}
    distribution: {name: 'manual'}
    state:
      - [14.2, 11.2, 0]
      - [9.8, 9.2, 0]
      - [4.5, 8.8, 0]
      - [12.9, 16.0, 0]
    goal:
      - [15.5, 7.2, 0]
      - [10.9, 2.6, 0]
      - [5.4, 12.9, 0]
      - [10.8, 12.5, 0]
    goal_threshold: 0.2
    vel_max: [0.6, 0.6]
    vel_min: [-0.6, -0.6]
    behavior: {name: 'dash', loop: true}  # patrol between state and goal
