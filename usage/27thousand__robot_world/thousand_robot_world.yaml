# All 1000 lidars are cast in one batched pass each step, with the
# compiled numba kernel when numba is installed (pip install ir-sim[fast]).

world:
  height: 63
  width: 63
  step_time: 0.1
  sample_time: 0.5
  offset: [0, 0]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - number: 1000
    distribution: {name: 'random', range_low: [1, 1, -3.14], range_high: [62, 62, 3.14], min_distance: 1.2}
    kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.3}
    vel_min: [-1.0, -1.0]
    vel_max: [1.0, 1.0]
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 6
        angle_range: 6.283185307179586   # full circle
        number: 64
        noise: false
    plot:
      show_goal: false

obstacle:
  - number: 126   # 1 m x 1 m boxes
    distribution: {name: 'random', range_low: [2, 2, 0], range_high: [61, 61, 0], min_distance: 3.0}
    shape: {name: 'rectangle', length: 1.0, width: 1.0}

  - number: 4   # 0.5 m walls just outside the 63 m x 63 m area
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 64, width: 0.5}
      - {name: 'rectangle', length: 64, width: 0.5}
      - {name: 'rectangle', length: 0.5, width: 63}
      - {name: 'rectangle', length: 0.5, width: 63}
    state:
      - [31.5, -0.25, 0]
      - [31.5, 63.25, 0]
      - [-0.25, 31.5, 0]
      - [63.25, 31.5, 0]
